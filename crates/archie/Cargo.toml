[package]
name = "archie"
description = "The archie command line: get and write markdown documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "archie"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["mongodb", "minio"]
minio = ["archie-store/minio"]
mongodb = ["archie-store/mongodb"]

[dependencies]
archie-core = { path = "../archie-core" }
archie-store = { path = "../archie-store" }
clap.workspace = true
os-shim.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
assert_cmd.workspace = true
mongodb.workspace = true
predicates.workspace = true
tempfile.workspace = true
