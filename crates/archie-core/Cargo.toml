[package]
name = "archie-core"
description = "Core library for archie: markdown documents as a typed tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["zod", "jsonschema"]
# Feature flags mirrored from tixschema so its proc macro expands
# cfg(feature = "...") checks successfully in this crate's scope.
zod = []
jsonschema = []

[dependencies]
# Error handling
thiserror.workspace = true

# Insertion-ordered map
indexmap.workspace = true

# Dates and times, with no clock
chrono.workspace = true

# Unicode full case folding, for link labels
unicase.workspace = true

# Unicode general categories, for emphasis delimiter runs
unicode-properties.workspace = true

# Serialization of the tree, to JSON and back, at any depth
serde.workspace = true
serde_json.workspace = true
serde_stacker.workspace = true
stacker.workspace = true

# TypeScript type + Zod schema generation from Rust models
tixschema.workspace = true
